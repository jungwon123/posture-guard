# LiveKit SFU 미디어 VM — wss://lk.34-50-58-157.sslip.io → host의 livekit:7880 (RTC 미디어는 UDP 직결)
map $http_upgrade $connection_upgrade { default upgrade; "" close; }

server {
  listen 80;
  server_name lk.34-50-58-157.sslip.io;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name lk.34-50-58-157.sslip.io;
  ssl_certificate     /etc/letsencrypt/live/lk.34-50-58-157.sslip.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/lk.34-50-58-157.sslip.io/privkey.pem;

  location / {
    proxy_pass http://host.docker.internal:7880;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}

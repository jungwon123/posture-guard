name: posture-guard

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-web:/var/www/certbot
    extra_hosts:
      - "host.docker.internal:host-gateway" # host 네트워크로 뜨는 livekit(7880) 프록시용
    depends_on: [api]

  api:
    build: ../backend-vm
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"] # 호스트 로컬 디버그용 (외부 노출은 nginx만)
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      # DB = Cloud SQL (관리형) — 전체 URL을 .env의 DATABASE_URL로 주입
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_SELF_URL: ${LIVEKIT_SELF_URL}
      LIVEKIT_SELF_KEY: ${LIVEKIT_SELF_KEY}
      LIVEKIT_SELF_SECRET: ${LIVEKIT_SELF_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    depends_on:
      redis: { condition: service_started }

  # 로컬 postgres 컨테이너는 Cloud SQL 이전(2026-07-23)으로 제거.
  # 롤백용 데이터 볼륨 posture-guard_pgdata 는 남아있음 — 지우지 말 것.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 캐시·presence 전용 — 영속화 없음, 64MB 상한 + LRU (e2-small 2GB 배려)
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]

  # livekit(SFU)은 미디어 전용 VM(lk-sfu-vm)으로 분리 — infra-lk/ 참고. 여기는 컨트롤 플레인만.

  # 인증서 발급/갱신 전용 — `docker compose --profile certs run --rm certbot ...`
  certbot:
    image: certbot/certbot
    profiles: ["certs"]
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-web:/var/www/certbot

volumes:
  pgdata:
  certbot-etc:
  certbot-web:

# 척추요정 API 게이트웨이 — https://34-64-158-222.sslip.io → api:8080
# WebSocket 업그레이드 (mesh 시그널링 /ws + livekit wss 공용)
map $http_upgrade $connection_upgrade { default upgrade; "" close; }

# 인증(로그인·가입) 브루트포스 방어 — Express 전역 리밋과 별개의 게이트웨이 방어선
limit_req_zone $binary_remote_addr zone=auth:1m rate=10r/m;

server {
  listen 80;
  server_name 34-64-158-222.sslip.io lk.34-64-158-222.sslip.io;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name 34-64-158-222.sslip.io;
  ssl_certificate     /etc/letsencrypt/live/34-64-158-222.sslip.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/34-64-158-222.sslip.io/privkey.pem;
  client_max_body_size 2m; # sync 데이터(JSONB) 여유

  location = /api/register     { limit_req zone=auth burst=5 nodelay; proxy_pass http://api:8080; include /etc/nginx/conf.d/proxy.inc; }
  location = /api/login        { limit_req zone=auth burst=5 nodelay; proxy_pass http://api:8080; include /etc/nginx/conf.d/proxy.inc; }
  location = /api/google-login { limit_req zone=auth burst=5 nodelay; proxy_pass http://api:8080; include /etc/nginx/conf.d/proxy.inc; }
  location /api/ { proxy_pass http://api:8080; include /etc/nginx/conf.d/proxy.inc; }
  location /ws   { proxy_pass http://api:8080; include /etc/nginx/conf.d/proxy.inc; } # (구) mesh 시그널링
  location / { return 404; }
}

# LiveKit SFU는 미디어 전용 VM(lk-sfu-vm, infra-lk/)으로 분리 — 이 VM은 컨트롤 플레인만 서빙.
